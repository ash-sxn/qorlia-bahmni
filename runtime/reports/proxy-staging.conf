# Same authenticated OpenMRS session bridge as the official Bahmni proxy.
# Prefer a newly issued session, otherwise retain the incoming session.
map "$upstream_cookie_JSESSIONID:$cookie_JSESSIONID" $reports_session_id {
    ~^([^:]+): $1;
    ~^:([^:]+)$ $1;
    default "";
}
map $reports_session_id $reports_session_cookie {
    "" "";
    default "reporting_session=$reports_session_id; Path=/; HttpOnly; Secure; SameSite=Lax";
}
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    location /bahmni_config/ {
        alias /srv/bahmni_config/;
        autoindex off;
    }
    location = /openmrs/auth {
        proxy_pass http://patient-documents:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Native CSV error links use this path. Retain the document service's session check.
    location ^~ /uploaded-files/mrs/ {
        absolute_redirect off;
        # The OpenMRS session cookie is scoped to /openmrs, so redirect before checking it.
        return 302 /openmrs/auth?requested_document=$uri;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /openmrs/ {
        proxy_pass http://openmrs:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        add_header Set-Cookie $reports_session_cookie always;
    }
    location /bahmnireports/ {
        proxy_pass http://reports:8051;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
